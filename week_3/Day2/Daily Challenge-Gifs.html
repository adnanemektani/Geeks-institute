<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily challenge: Gifs</title>
  </head>
  <body>
    <form id="form1">
      <label for="searchInput">Enter a gif category:</label>
      <input id="searchInput" />
      <button type="submit" id="button">Submit</button>
    </form>

    <div id="gifContainer"></div>
    <button id="deleteAll">DELETE ALL</button>
  </body>
  <script>
    const form = document.getElementById("form1");
    const search = document.getElementById("searchInput");
    const gifContainer = document.getElementById("gifContainer");
    const deleteGif = document.getElementById("deleteAll");


     deleteGif.addEventListener('click', () =>{
            gifContainer.innerHTML ='CCCC'
        })

    form.addEventListener("submit", async (gif) => {
      gif.preventDefault();
      const Searchbar = search.value;

      try {
        const response = await fetch(
          `https://api.giphy.com/v1/gifs/random?api_key=hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My&tag=${Searchbar}`,
        );
        if (!response.ok) {
          return "ooops ther is a probleme";
        }
        const data = await response.json();
        const imgUrl = data.data.images.original.url;
        const div = document.createElement('div')
        const img = document.createElement("img");
        img.src = imgUrl;
    
        const deletBtn = document.createElement('button')
        deletBtn.innerHTML = 'DELETE'


        deletBtn.addEventListener('click', () => {
            div.remove()
        })
        div.appendChild(img)
        div.appendChild(deletBtn)
        gifContainer.appendChild(div)

       

      } catch (err) {
        return "erruer 400";
      }
    });



  </script>
</html>
