<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <style>
      body {
        display: flex;
        background-color: aliceblue;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      form {
        background: white;
        padding: 30px;
        border-radius: 16px;
        width: 400px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        border: 5px;
      }
      button#Convert {
        background-color: #3b82f6;
        width: 100%;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      select,
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #666;
        font-size: 13px;
      }

      button#switch {
        display: block;
        margin: 0 auto 15px auto;
        background: white;
        border: 1px solid #ddd;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 18px;
      }
      #result {
        text-align: center;
        margin-top: 15px;
        padding: 12px;
        background: #f4f4f4;
        border-radius: 8px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <div id="CurrencyConverter">
        <select id="from">
          from
        </select>
        <button id="switch" type="button">⇄</button>
        <select id="to">
          to
        </select>
        <label for="Amount">Amount</label>
        <input type="number" id="Amount" />
      </div>
      <button id="Convert" type="submit">Convert</button>
      <div id="result"></div>
    </form>
  </body>
  <script src="script.js"></script>
</html>
